topics:
  - id: ai-engineering
    label: AI & Engineering
    title: AI systems, agents, and engineering
    description: Building, evaluating, and questioning the systems behind modern AI—from agent workflows and RAG to protocols, simulation, and distributed infrastructure.
  - id: governance-trust
    label: Governance & Trust
    title: Governance, public systems, and trust
    description: Policy, privacy, evidence, public-sector technology, and the practical machinery required to make consequential systems reviewable.
  - id: data-decisions
    label: Data & Decisions
    title: Data, measurement, and decisions
    description: Optimization, forecasting, labor markets, decision intelligence, and the awkward distance between a metric and the thing it claims to measure.
  - id: media-culture
    label: Media & Culture
    title: Media, culture, and influence
    description: How stories, platforms, localization, and cultural exports change behavior—and how data might help us see those effects without flattening them.
  - id: people-society
    label: People & Society
    title: People, performance, and society
    description: Football, health, human capability, social enterprise, and other attempts to measure or improve messy real-world outcomes.
  - id: interfaces-futures
    label: Interfaces & Futures
    title: Interfaces, maps, and possible futures
    description: Spatial computing, visualization, new software interfaces, and speculative tools that make complex systems easier to inspect.

