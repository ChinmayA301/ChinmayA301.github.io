# Proposed app name; verify availability in the chosen account before creating it.
app = "chinmay-live-data-lab"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "60s"
[build]
  dockerfile = "live-data/Dockerfile"
[env]
  PORT = "8080"
  DB_PATH = "/data/lab.sqlite"
[mounts]
  source = "lab_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
