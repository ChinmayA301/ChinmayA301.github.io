name: Publish stakeholder snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: snapshot-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: live-data/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: live-data
      - run: npm test
        working-directory: live-data
      - run: node scripts/build-free.mjs && node scripts/publish-snapshot.mjs
        working-directory: live-data
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          PREVIOUS_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live-data/public
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
