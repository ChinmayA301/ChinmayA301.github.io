title: Chinmay Arora
email: chinmayarora2001@gmail.com
description: >-
  Chinmay Arora's portfolio and research notes on AI engineering, stateful agent workflows, data science, AI governance, retrieval, evaluation, and analytics engineering.
baseurl: ""
url: "https://app.chinmayarora.com"
blog_root: "https://brainvomit.blog/"
default_og_image: "/assets/images/default-og.png"
lang: en_US
timezone: America/Chicago

markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - live-data
  - docs/FOOTBALL_MATCH_PULSE_PLAN.md
  - docs/LIVE_DATA_AUDIT.md
  - PRODUCT.md
  - DESIGN.md
  - Readme.md
  - VISIBILITY.md
  - docs/PORTFOLIO_ROADMAP.md
  - docs/DOMAIN_MIGRATION.md
  - docs/LIVE_DATA_PROJECTS.md
  - audit_output
  - scripts
  - brainvomit
  - _config.brainvomit.yml
  - wrangler.brainvomit.jsonc

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Chinmay Arora

