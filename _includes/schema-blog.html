{%- assign schema_blog_path = site.blog_root | default: '/blog/' -%}
{%- assign schema_blog_url = schema_blog_path | absolute_url -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "@id": "{{ schema_blog_url }}#blog",
  "url": "{{ schema_blog_url }}",
  "name": {{ site.title | default: "Brain Vomit" | jsonify }},
  "description": {{ site.description | jsonify }},
  "inLanguage": "en-US",
  "author": {
    "@type": "Person",
    "@id": "https://app.chinmayarora.com/#person",
    "name": "Chinmay Arora",
    "url": "https://app.chinmayarora.com/"
  },
  "publisher": {
    "@type": "Person",
    "@id": "https://app.chinmayarora.com/#person",
    "name": "Chinmay Arora"
  }
}
</script>
